# Compose for local Docker / Podman runs.
# The capability is granted both at the process level (cap_add) and via
# setcap in the Dockerfile; either alone is usually enough on Docker,
# but rootless Podman is happiest when both are set.

services:
  monitor:
    build: .
    image: fping-monitor:local
    container_name: fping-monitor
    restart: unless-stopped

    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp:size=32m

    user: "10001:10001"

    ports:
      - "9100:9100"

    volumes:
      - ./config:/etc/fping-monitor:ro
      - monitor-data:/var/lib/fping-monitor

    environment:
      TZ: UTC
      # Put the alert API token in a real secret store; this is just an example.
      ALERT_API_TOKEN: replace-me

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9100/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  monitor-data:
