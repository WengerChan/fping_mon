# Example configuration for fping-monitor.
# All values shown are the defaults; the only required section is `targets`.

server:
  listen: 0.0.0.0
  port: 9100

probe:
  interval_seconds: 10          # how often each target is probed
  timeout_ms: 1000              # per-packet timeout passed to fping
  packets: 3                    # number of packets per round
  batch_size: 200               # how many targets per fping invocation
  batch_jitter_ms: 0            # random delay added between batches (0 = off)
  fping_binary: /usr/bin/fping # apt 包实际路径；macOS Homebrew 在 /usr/local/sbin/fping

state:
  down_after_failures: 3        # consecutive failed rounds to confirm DOWN
  up_after_successes: 3         # consecutive successful rounds to confirm UP
  mass_failure_ratio: 0.5       # if more than this fraction of targets fail in
                                # one round, treat the round as mass failure

notification:
  enabled: true
  url: https://alert.example.internal/api/v1/events
  timeout_seconds: 5
  max_attempts: 8
  max_backoff_seconds: 60
  token_env: ALERT_API_TOKEN    # env var holding the bearer token
  monitor_instance: monitor-a

storage:
  path: /var/lib/fping-monitor/state.db

targets:
  - id: core-switch-01
    address: 10.10.0.1
    labels:
      site: shanghai
      group: network

  - id: app-server-01
    address: 10.10.1.10
    labels:
      site: shanghai
      group: application

# 布谷鸟配置
cuckoo:
  app_key: ""
  url:
    receivemap: ""
    # forward: ""