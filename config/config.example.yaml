# fping-monitor 示例配置。
# 所有值都是默认值；唯一必填段是 targets。

# HTTP 服务：暴露 Prometheus 指标与就绪探针
server:
  listen: 0.0.0.0            # 监听地址
  port: 9100                  # 监听端口

# 探测循环参数
probe:
  interval_seconds: 10        # 每轮探测间隔
  timeout_ms: 1000            # 单包超时，传给 fping
  packets: 3                  # 每轮发送的探测包数
  batch_size: 200             # 每批 fping 调用承载的目标数
  batch_jitter_ms: 0          # 批次间随机抖动（0=关闭）
  fping_binary: /usr/bin/fping # fping 可执行文件路径（apt 包路径；macOS Homebrew 在 /usr/local/sbin/fping）

# 状态机阈值
state:
  down_after_failures: 3      # 连续失败多少轮才确认 DOWN
  up_after_successes: 3       # 连续成功多少轮才确认 UP
  mass_failure_ratio: 0.5     # 单轮失败目标占比超过该值视为大面积故障

# Outbox 存储位置
storage:
  path: /var/lib/fping-monitor/state.db               # SQLite 文件路径

# 监控目标列表
#
# address 支持三种语法：
#   - 单 IP 或主机名：1 个 Target，id 用原值
#   - CIDR（如 10.1.1.0/24）：展开为网络内的 host IP；/30 及以下全保留，
#     /29 及以上丢网络号与广播地址
#   - 区间（如 10.1.1.100-10.1.1.200）：闭区间，包含两端
#
# 展开超过 max_expansion 的 target 会被拒绝，防止误写大段把内存打爆。
targets:
  - id: core-switch-01                                 # 目标 ID，必须唯一
    address: 10.10.0.1                                 # 单 IP：1 个 Target
    labels:                                            # 静态标签（白名单内）
      site: shanghai
      group: network

  - id: app-server-01
    address: 10.10.1.10
    labels:
      site: shanghai
      group: application

  - id: subnet-core                                    # 基础 ID；展开后为 subnet-core-1 … subnet-core-254
    address: 10.1.1.0/24                               # CIDR：254 个 Target（丢 .0/.255）
    labels:
      site: shanghai
      group: network

  - id: range-app                                      # 基础 ID；展开后为 range-app-100 … range-app-200
    address: 10.1.2.100-10.1.2.200                     # 区间：101 个 Target（闭区间）
    labels:
      site: shanghai
      group: application

# 单 target 展开成多个 host 的上限（约 2 个 C 段）。超出时 ConfigError。
max_expansion: 512

# Webhook 通知配置
webhook:
  enabled: true                                       # 是否启用
  url: https://alert.example.internal/api/v1/events   # 接收端 URL（http/https）
  # transport 内 HTTP 重试上限：抗网络抖动，单次 worker tick 内最多发起这么多次请求
  max_attempts: 3
  # worker tick 上限：抗持续故障，整条事件最多被 outbox worker 调度这么多次
  max_event_attempts: 10
  # 单层退避封顶秒数（k8s 风格指数退避 + ±10% 抖动）
  max_backoff_seconds: 60
  token_env: ALERT_API_TOKEN                          # 持有 Bearer token 的环境变量名
  monitor_instance: monitor-a                          # 随事件上报的监控实例标识

# 布谷鸟告警通道
cuckoo:
  enabled: false                                       # 显式开关，未启用时不投递
  app_key: ""                                          # 布谷鸟分配的应用标识
  url:
    receivemap: ""                                     # 接入接口 URL；为空则跳过 receivemap channel
    # forward: ""                                      # 转发接口 URL；为空则跳过 forward channel
  max_attempts: 3                                      # transport 内 HTTP 重试上限
  max_event_attempts: 10                               # worker tick 上限
  max_backoff_seconds: 60                              # 单层退避封顶秒数